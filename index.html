<!-- Modal Form: Manage Existing Lifecycle Asset State -->
<div class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex justify-center items-center p-4 z-50" id="manageUnitModal">
    <div class="bg-slate-800 rounded-2xl max-w-md w-full shadow-2xl border border-slate-700 overflow-hidden transform scale-100 transition duration-300">
        <div class="px-6 py-4 bg-slate-900 border-b border-slate-700 flex justify-between items-center">
            <h3 class="font-bold text-white flex items-center gap-2"><i class="w-5 h-5 text-blue-500" data-lucide="edit-3"></i> Lifecycle Management Deck</h3>
            <button class="text-slate-400 hover:text-white" onclick="closeModal('manageUnitModal')"><i class="w-5 h-5" data-lucide="x"></i></button>
        </div>
        <div class="p-6 space-y-4">
            <!-- Asset Information Badge -->
            <div>
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Target Selected Asset</span>
                <div class="mt-1 flex items-center gap-3">
                    <span class="px-3.5 py-1.5 bg-blue-500/15 border border-blue-500/30 text-blue-400 text-base font-black rounded-xl" id="manageUnitBadge">--</span>
                    <div>
                        <p class="text-sm font-bold text-slate-200" id="manageUnitCategory">--</p>
                        <p class="text-xs text-slate-400" id="manageUnitType">--</p>
                    </div>
                </div>
            </div>

            <!-- Overdue Warning -->
            <div class="hidden p-3 bg-rose-500/10 border border-rose-500/30 text-rose-400 rounded-xl flex items-center gap-2" id="overdueAlert">
                <i class="w-5 h-5 shrink-0" data-lucide="alert-circle"></i>
                <span class="text-xs font-bold leading-tight">This asset has passed its targeted completion milestone date.</span>
            </div>

            <!-- Editable Scope of Work / Fault Diagnosis -->
            <div class="space-y-1.5">
                <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider">Scope of Work / Diagnosis</label>
                <textarea class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-sm focus:outline-none focus:border-blue-500 text-slate-100 placeholder-slate-600" id="manageUnitDescription" rows="2" placeholder="Describe mechanical/electrical repair details..."></textarea>
            </div>

            <!-- Editable Downtime Status Phase Select -->
            <div class="space-y-1.5">
                <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider">Current Downtime Status</label>
                <select class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-sm focus:outline-none focus:border-blue-500 text-slate-100" id="manageUnitStatus" onchange="handleStatusSelectChange(this.value)">
                    <option value="ongoing">On-Going Repair</option>
                    <option value="waiting">Waiting for Parts/Manpower</option>
                    <option value="released">Released Unit</option>
                </select>
            </div>

            <!-- Completion Progress Slider -->
            <div class="space-y-2 bg-slate-900/40 p-3 rounded-xl border border-slate-700/50">
                <div class="flex justify-between items-center">
                    <span class="text-xs font-bold text-slate-300 uppercase tracking-wider">Completion Matrix</span>
                    <span class="text-sm font-black text-amber-400" id="progressPercentDisplay">--%</span>
                </div>
                <input class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-blue-500" id="manageUnitProgressSlider" max="100" min="0" oninput="updateProgressDisplay(this.value)" type="range"/>
            </div>

            <!-- Milestone Date Input -->
            <div class="space-y-1.5 bg-slate-900/40 p-3 rounded-xl border border-slate-700/50">
                <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider">Target Completion Milestone</label>
                <input class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-sm focus:outline-none focus:border-blue-500 text-slate-100" id="manageUnitTargetDate" onchange="updateTargetDateState(this.value)" type="date"/>
            </div>

            <!-- Footer Modal Controls -->
            <div class="pt-3 flex gap-3 justify-between border-t border-slate-700">
                <button class="px-4 py-2.5 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 rounded-xl text-sm font-semibold border border-rose-500/25 transition flex items-center gap-2" onclick="deleteUnit()">
                    <i class="w-4 h-4" data-lucide="trash-2"></i> Retract
                </button>
                <button class="px-4 py-2.5 bg-blue-600 text-white rounded-xl text-sm font-semibold hover:bg-blue-500 transition" onclick="saveAssetDetailedChanges()">Save Diagnostics</button>
            </div>
        </div>
    </div>
</div>
